<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-Circuit Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F0F;
    --card: #1A1A1A;
    --card-hover: #222222;
    --border: #2A2A2A;
    --text: #FFFFFF;
    --dim: #777777;
    --dim-light: #999999;
    --legs: #00E676;
    --legs-bg: #00E67615;
    --legs-glow: #00E67640;
    --core: #FFAB00;
    --core-bg: #FFAB0015;
    --core-glow: #FFAB0040;
    --upper: #00B0FF;
    --upper-bg: #00B0FF15;
    --upper-glow: #00B0FF40;
    --run: #E040FB;
    --run-bg: #E040FB15;
    --run-glow: #E040FB40;
    --progress-bg: #1E1E1E;
    --complete: #00E676;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .tracker {
    max-width: 540px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, var(--legs), var(--core), var(--upper), var(--run));
    border-radius: 1px;
  }
  .header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--dim-light);
    font-weight: 400;
    margin-bottom: 8px;
  }
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .week-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--dim-light);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .week-nav button:hover {
    background: var(--card-hover);
    color: var(--text);
  }
  .week-label {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--text);
    min-width: 200px;
    text-align: center;
  }
  .week-label .dates {
    font-size: 11px;
    color: var(--dim);
    margin-top: 2px;
  }
  .progress-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 28px;
    padding: 16px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .progress-ring-wrap {
    position: relative;
    width: 72px;
    height: 72px;
    flex-shrink: 0;
  }
  .progress-ring {
    transform: rotate(-90deg);
    width: 72px;
    height: 72px;
  }
  .progress-ring .bg {
    fill: none;
    stroke: var(--progress-bg);
    stroke-width: 5;
  }
  .progress-ring .fg {
    fill: none;
    stroke: url(#progressGradient);
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-pct {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .progress-stats {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .progress-stat {
    font-size: 12px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-stat .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .progress-stat .count {
    font-family: 'Space Mono', monospace;
    color: var(--text);
    font-weight: 700;
    margin-left: auto;
    min-width: 28px;
    text-align: right;
  }
  .category {
    margin-bottom: 16px;
    animation: fadeUp 0.4s ease both;
  }
  .category:nth-child(1) { animation-delay: 0.05s; }
  .category:nth-child(2) { animation-delay: 0.10s; }
  .category:nth-child(3) { animation-delay: 0.15s; }
  .category:nth-child(4) { animation-delay: 0.20s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .category-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .category-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .category-name {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .category-target {
    font-size: 11px;
    color: var(--dim);
    margin-left: auto;
    font-family: 'Space Mono', monospace;
  }
  .slots {
    display: flex;
    gap: 8px;
  }
  .slot {
    flex: 1;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .slot::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .slot:hover {
    border-color: var(--slot-color);
    transform: translateY(-1px);
  }
  .slot:hover::before {
    opacity: 1;
  }
  .slot:active {
    transform: scale(0.97);
  }
  .slot .check-ring {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    flex-shrink: 0;
  }
  .slot .check-ring svg {
    width: 18px;
    height: 18px;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .slot .slot-label {
    font-size: 11px;
    color: var(--dim);
    font-weight: 500;
    transition: color 0.25s;
    text-align: center;
    line-height: 1.3;
  }
  .slot .slot-day {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    opacity: 0.5;
    transition: opacity 0.25s;
  }
  .slot.done {
    border-color: var(--slot-color);
  }
  .slot.done::before {
    background: var(--slot-bg);
    opacity: 1;
  }
  .slot.done .check-ring {
    border-color: var(--slot-color);
    background: var(--slot-color);
    box-shadow: 0 0 16px var(--slot-glow);
  }
  .slot.done .check-ring svg {
    opacity: 1;
    transform: scale(1);
  }
  .slot.done .slot-label {
    color: var(--text);
  }
  .slot.done .slot-day {
    opacity: 1;
    color: var(--slot-color);
  }
  .streak-bar {
    margin-top: 20px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .streak-icon {
    font-size: 20px;
  }
  .streak-info {
    flex: 1;
  }
  .streak-label {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  .streak-count {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--legs), var(--run));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    font-size: 10px;
    font-family: 'Space Mono', monospace;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .reset-btn:hover {
    border-color: #ff5252;
    color: #ff5252;
  }
  .confetti-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1000;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: confettiFall 1.5s ease-out forwards;
  }
  @keyframes confettiFall {
    0% {
      transform: translateY(-20px) rotate(0deg) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(720deg) scale(0.3);
      opacity: 0;
    }
  }
  @media (max-width: 480px) {
    body { padding: 16px; }
    .slot { padding: 10px 8px; }
    .slot .check-ring { width: 30px; height: 30px; }
    .slot .slot-label { font-size: 10px; }
    .progress-section { gap: 16px; padding: 12px; }
  }
</style>
</head>
<body>
<div class="tracker" id="app">
  <div class="header">
    <h1>Weekly Tracker</h1>
    <div class="week-nav">
      <button onclick="changeWeek(-1)" title="Previous week">&#8249;</button>
      <div class="week-label">
        <div id="weekTitle">WEEK 1</div>
        <div class="dates" id="weekDates">Jan 1 – Jan 7</div>
      </div>
      <button onclick="changeWeek(1)" title="Next week">&#8250;</button>
    </div>
  </div>
  <div class="progress-section">
    <div class="progress-ring-wrap">
      <svg class="progress-ring" viewBox="0 0 72 72">
        <defs>
          <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--legs)" />
            <stop offset="33%" stop-color="var(--core)" />
            <stop offset="66%" stop-color="var(--upper)" />
            <stop offset="100%" stop-color="var(--run)" />
          </linearGradient>
        </defs>
        <circle class="bg" cx="36" cy="36" r="30" />
        <circle class="fg" id="progressArc" cx="36" cy="36" r="30"
                stroke-dasharray="188.5"
                stroke-dashoffset="188.5" />
      </svg>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
    <div class="progress-stats">
      <div class="progress-stat">
        <span class="dot" style="background:var(--legs)"></span>
        Legs <span class="count" id="statLegs">0/2</span>
      </div>
      <div class="progress-stat">
        <span class="dot" style="background:var(--core)"></span>
        Core <span class="count" id="statCore">0/2</span>
      </div>
      <div class="progress-stat">
        <span class="dot" style="background:var(--upper)"></span>
        Upper <span class="count" id="statUpper">0/2</span>
      </div>
      <div class="progress-stat">
        <span class="dot" style="background:var(--run)"></span>
        Runs <span class="count" id="statRuns">0/3</span>
      </div>
    </div>
  </div>
  <div id="categories"></div>
  <div class="streak-bar">
    <div class="streak-icon">🔥</div>
    <div class="streak-info">
      <div class="streak-label">Week Streak</div>
      <div class="streak-count" id="streakCount">0 weeks</div>
    </div>
    <button class="reset-btn" onclick="resetWeek()">Reset</button>
  </div>
</div>
<div class="confetti-container" id="confetti"></div>
<script>
const CATEGORIES = [
  {
    id: 'legs',
    name: 'Legs',
    subtitle: "Runner's Foundation",
    icon: '🦵',
    color: 'var(--legs)',
    bg: 'var(--legs-bg)',
    glow: 'var(--legs-glow)',
    target: 2,
    slots: ['Session 1', 'Session 2']
  },
  {
    id: 'core',
    name: 'Core',
    subtitle: 'The Stabiliser',
    icon: '🎯',
    color: 'var(--core)',
    bg: 'var(--core-bg)',
    glow: 'var(--core-glow)',
    target: 2,
    slots: ['Session 1', 'Session 2']
  },
  {
    id: 'upper',
    name: 'Upper Body',
    subtitle: 'Push & Pull',
    icon: '💪',
    color: 'var(--upper)',
    bg: 'var(--upper-bg)',
    glow: 'var(--upper-glow)',
    target: 2,
    slots: ['Session 1', 'Session 2']
  },
  {
    id: 'runs',
    name: 'Runs',
    subtitle: 'Hit the road',
    icon: '🏃',
    color: 'var(--run)',
    bg: 'var(--run-bg)',
    glow: 'var(--run-glow)',
    target: 3,
    slots: ['Run 1', 'Run 2', 'Run 3']
  }
];
function getWeekKey(offset = 0) {
  const now = new Date();
  const day = now.getDay();
  const mondayOffset = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset + (offset * 7));
  monday.setHours(0, 0, 0, 0);
  return monday.toISOString().split('T')[0];
}
function getWeekDates(weekKey) {
  const monday = new Date(weekKey + 'T00:00:00');
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const opts = { month: 'short', day: 'numeric' };
  return monday.toLocaleDateString('en-GB', opts) + ' – ' + sunday.toLocaleDateString('en-GB', opts);
}
function getWeekNumber(weekKey) {
  const startKey = getData().__startWeek || weekKey;
  const start = new Date(startKey + 'T00:00:00');
  const current = new Date(weekKey + 'T00:00:00');
  const diff = Math.round((current - start) / (7 * 24 * 60 * 60 * 1000));
  return Math.max(1, diff + 1);
}
const STORAGE_KEY = '3circuit_tracker_v2';
function getData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch { return {}; }
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function getWeekData(weekKey) {
  const data = getData();
  if (!data[weekKey]) {
    data[weekKey] = {};
    CATEGORIES.forEach(cat => {
      cat.slots.forEach((_, i) => {
        data[weekKey][cat.id + '_' + i] = null;
      });
    });
    if (!data.__startWeek) data.__startWeek = weekKey;
    saveData(data);
  }
  return data[weekKey];
}
function toggleSlot(weekKey, slotId) {
  const data = getData();
  if (!data[weekKey]) getWeekData(weekKey);
  if (data[weekKey][slotId]) {
    data[weekKey][slotId] = null;
  } else {
    data[weekKey][slotId] = new Date().toISOString();
  }
  saveData(data);
  render();
  checkCompletion();
}
function calcStreak() {
  const data = getData();
  let streak = 0;
  let offset = 0;
  const thisWeek = getWeekKey(0);
  const thisData = data[thisWeek];
  const thisComplete = thisData && isWeekComplete(thisData);
  if (!thisComplete) offset = -1;
  while (true) {
    const wk = getWeekKey(offset);
    const wd = data[wk];
    if (!wd || !isWeekComplete(wd)) break;
    streak++;
    offset--;
  }
  return streak;
}
function isWeekComplete(weekData) {
  for (const cat of CATEGORIES) {
    let done = 0;
    cat.slots.forEach((_, i) => {
      if (weekData[cat.id + '_' + i]) done++;
    });
    if (done < cat.target) return false;
  }
  return true;
}
let currentWeekOffset = 0;
function changeWeek(dir) {
  currentWeekOffset += dir;
  if (currentWeekOffset > 0) currentWeekOffset = 0;
  render();
}
function resetWeek() {
  const weekKey = getWeekKey(currentWeekOffset);
  const data = getData();
  if (data[weekKey]) {
    Object.keys(data[weekKey]).forEach(k => data[weekKey][k] = null);
    saveData(data);
  }
  render();
}
function render() {
  const weekKey = getWeekKey(currentWeekOffset);
  const weekData = getWeekData(weekKey);
  document.getElementById('weekTitle').textContent = 'WEEK ' + getWeekNumber(weekKey);
  document.getElementById('weekDates').textContent = getWeekDates(weekKey);
  const container = document.getElementById('categories');
  container.innerHTML = '';
  let totalDone = 0;
  let totalTarget = 0;
  CATEGORIES.forEach(cat => {
    let catDone = 0;
    const catEl = document.createElement('div');
    catEl.className = 'category';
    let slotsHtml = '';
    cat.slots.forEach((label, i) => {
      const slotId = cat.id + '_' + i;
      const isDone = !!weekData[slotId];
      if (isDone) catDone++;
      const dayStr = isDone
        ? new Date(weekData[slotId]).toLocaleDateString('en-GB', { weekday: 'short' }).toUpperCase()
        : '';
      slotsHtml += '<div class="slot ' + (isDone ? 'done' : '') + '"' +
        ' style="--slot-color:' + cat.color + ';--slot-bg:' + cat.bg + ';--slot-glow:' + cat.glow + '"' +
        ' onclick="toggleSlot(\'' + weekKey + '\',\'' + slotId + '\')">' +
        '<div class="check-ring">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="' + (isDone ? '#0F0F0F' : cat.color) + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="4 12 10 18 20 6" />' +
        '</svg></div>' +
        '<div class="slot-label">' + label + '</div>' +
        '<div class="slot-day">' + dayStr + '</div></div>';
    });
    totalDone += catDone;
    totalTarget += cat.target;
    catEl.innerHTML = '<div class="category-header">' +
      '<div class="category-icon" style="background:' + cat.bg + '">' + cat.icon + '</div>' +
      '<div><div class="category-name" style="color:' + cat.color + '">' + cat.name + '</div></div>' +
      '<div class="category-target">' + catDone + '/' + cat.target + '</div></div>' +
      '<div class="slots">' + slotsHtml + '</div>';
    container.appendChild(catEl);
    const statId = 'stat' + cat.id.charAt(0).toUpperCase() + cat.id.slice(1);
    const statEl = document.getElementById(statId);
    if (statEl) {
      statEl.textContent = catDone + '/' + cat.target;
      statEl.style.color = catDone >= cat.target ? cat.color : '';
    }
  });
  const pct = totalTarget > 0 ? Math.round((totalDone / totalTarget) * 100) : 0;
  const circumference = 188.5;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('progressArc').style.strokeDashoffset = offset;
  document.getElementById('progressPct').textContent = pct + '%';
  const streak = calcStreak();
  document.getElementById('streakCount').textContent = streak + ' week' + (streak !== 1 ? 's' : '');
}
function checkCompletion() {
  const weekKey = getWeekKey(currentWeekOffset);
  const weekData = getWeekData(weekKey);
  if (isWeekComplete(weekData)) {
    launchConfetti();
  }
}
function launchConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#00E676', '#FFAB00', '#00B0FF', '#E040FB', '#FF6D00', '#FFFFFF'];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = (1 + Math.random() * 1.5) + 's';
    piece.style.width = (4 + Math.random() * 6) + 'px';
    piece.style.height = (4 + Math.random() * 6) + 'px';
    container.appendChild(piece);
  }
  setTimeout(function() { container.innerHTML = ''; }, 3000);
}
render();
</script>
</body>
</html>
